name: Publish News Briefing to Instagram

on:
  schedule:
    # 매일 하루 1번, 12:33 KST (=UTC 전날 03:33) 실행.
    # 기존 용어 카드(07:33/11:04/18:07 KST)와 겹치지 않게, 정각/30분도 피해서 오프셋.
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "체크하면 카드만 생성하고 인스타그램에는 게시하지 않음 (미리보기용)"
        type: boolean
        default: false

permissions:
  contents: write

# publish.yml(용어 카드)과 큐(content/queue/)를 공유하므로, group 이름을 반드시 동일하게
# 맞춰서 두 워크플로가 절대 동시에 실행되지 않도록 합니다 — 동시에 돌면 git push 충돌로
# 이미 게시한 카드가 큐에 남아 다음 실행 때 중복 게시되는 문제가 생길 수 있습니다.
concurrency:
  group: welllog-publish-queue
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install requests anthropic playwright trafilatura

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Generate today's news briefing (AI) and add to queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/generate_news_briefing.py

      - name: Commit generated content (so raw URLs exist before publishing)
        run: |
          git config user.name "welllog-bot"
          git config user.email "welllog-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "chore: generate news briefing [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
            echo "push 실패, 재시도 ($i/3)..."
            sleep 5
          done

      - name: Publish next queued post
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish_to_instagram.py

      - name: Commit queue update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "welllog-bot"
          git config user.email "welllog-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "chore: daily news briefing post [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
            echo "push 실패, 재시도 ($i/3)..."
            sleep 5
          done
