name: Publish to Instagram

on:
  schedule:
    # 매일 11:07 KST (=UTC 02:07) 실행. 시간 바꾸고 싶으면 아래 cron 값만 수정하세요.
    - cron: '7 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish next queued post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish_to_instagram.py

      - name: Commit queue update
        run: |
          git config user.name "welllog-bot"
          git config user.email "welllog-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "chore: mark post as published [skip ci]"
          git push
